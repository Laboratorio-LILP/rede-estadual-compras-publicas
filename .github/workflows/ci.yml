name: CI

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Mesma major do runtime da imagem Docker (node:22-bookworm-slim).
          node-version: "22"
          cache: npm

      - name: Instalar dependências (npm ci, mesmo lock do build Docker)
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Testes do front (react-scripts)
        run: npm test
        env:
          CI: "true"

      - name: Testes de API (node:test, banco temporário por execução)
        run: npm run test:api

      - name: Build de produção
        run: npm run build
