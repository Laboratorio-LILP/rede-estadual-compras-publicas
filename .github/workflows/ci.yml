# Esteira da BASE NOVA (Django + PostgreSQL + Vite).
#
# Roda o MESMO laco de verificacao da maquina, pelos mesmos alvos do Makefile e
# dentro dos mesmos conteineres. E o ponto do ADR-008 transversal: "os testes
# passam" precisa ser uma afirmacao sobre o codigo, nao sobre um computador.

name: CI — base nova

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "a11y/**"
      - ".devcontainer/**"
      - "Makefile"
      - ".env.example"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "a11y/**"
      - ".devcontainer/**"
      - "Makefile"
      - ".env.example"
      - ".github/workflows/ci.yml"

concurrency:
  group: base-nova-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacao:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o ambiente
        # Segredo efemero, sorteado por execucao: nada fixo, nada versionado.
        run: |
          cp .env.example .env
          sed -i "s|^RECPSP_DB_PASSWORD=.*|RECPSP_DB_PASSWORD=$(openssl rand -hex 32)|" .env
          sed -i "s|^RECPSP_WEB_POLLING=.*|RECPSP_WEB_POLLING=0|" .env

      - name: Construir as imagens de desenvolvimento
        run: make build

      - name: Lint (ruff, mypy, tsc, ESLint, tokens)
        run: make lint

      - name: Testes do back (pytest, dentro do conteiner)
        run: make test-back

      - name: Testes do front (Vitest, dentro do conteiner)
        run: make test-front

      - name: Build do front e checagem de implantacao do back
        run: make build-app

      - name: Acessibilidade (piso do ADR-007)
        # axe-core e HTML_CodeSniffer sobre as duas paginas no ar, mais a
        # suite de teclado. Roda na imagem oficial do Playwright.
        run: make a11y-check

      - name: Guardar o rastro quando a acessibilidade reprovar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rastro-a11y
          path: a11y/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Derrubar o stack
        if: always()
        run: make down

  auditoria:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o ambiente
        run: |
          cp .env.example .env
          sed -i "s|^RECPSP_DB_PASSWORD=.*|RECPSP_DB_PASSWORD=$(openssl rand -hex 32)|" .env

      - name: Construir as imagens de desenvolvimento
        run: make build

      - name: Auditar as cadeias de dependencia
        run: make auditoria

  imagem:
    name: Imagem de producao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem de producao do back
        # Lacuna apontada na auditoria do legado: a imagem nunca era construida
        # na esteira, entao so quebrava na hora de implantar.
        run: make imagem

      - name: Conferir que a imagem sobe e nao roda como root
        run: |
          test "$(docker run --rm --entrypoint id lilp-recpsp-nova:prod -un)" = "recpsp"
          docker run --rm --entrypoint python lilp-recpsp-nova:prod -c "import django; print(django.get_version())"
