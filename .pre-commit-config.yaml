# Laco curto de verificacao antes do commit.
#
# Divisao deliberada (ADR-008): o que e barato e isolado roda no gancho de
# commit; o que precisa das dependencias do projeto roda no gancho de push,
# DENTRO do conteiner, pelos mesmos alvos do Makefile que a esteira usa.
# Nenhuma verificacao depende de Python, Node ou banco instalados na maquina.
#
# Instalacao:  pre-commit install --install-hooks

default_install_hook_types: [pre-commit, pre-push]

# O legado esta CONGELADO (ADR 0002): os ganchos genericos nao o reformatam.
# Sem esta exclusao, uma correcao de seguranca no legado viria acompanhada de
# um diff de espaco em branco na arvore que ninguem pediu para mexer.
exclude: |
  (?x)^(
    server/|
    src/|
    public/|
    build/|
    package-lock\.json$|
    frontend/package-lock\.json$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      # O ruff roda DENTRO DO CONTEINER, e nao por um `rev` proprio deste
      # arquivo. O motivo e' concreto: enquanto o gancho fixava a v0.8.6 e a
      # imagem instalava a 0.16.5, os dois DISCORDAVAM sobre como formatar um
      # `assert` com mensagem. O gancho reformatava de um jeito, `make lint-back`
      # exigia o outro, e o arquivo nao podia satisfazer os dois — commit verde
      # na maquina, esteira vermelha no GitHub.
      #
      # Uma ferramenta, um lugar: o conteiner (ADR-008). Isto CONFERE e nao
      # corrige; quando reprovar, rode `make format`.
      #
      # Fica o risco conhecido de `requirements-dev.txt` declarar `ruff` por
      # faixa: uma reconstrucao futura pode trazer versao com formatacao
      # diferente. A decisao de fixar versao e' de politica de dependencias e
      # vale para o conjunto, nao so para o ruff.
      - id: ruff-conteiner
        name: ruff (regras e formatacao), no conteiner
        entry: make lint-back
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$


      - id: tokens
        name: cor so em tokens.css
        entry: make lint-tokens
        language: system
        pass_filenames: false
        files: \.(css|ts|tsx|html|svg)$

      - id: tipos
        name: mypy (back) e tsc (front), no conteiner
        entry: make lint-tipos
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: eslint
        name: ESLint, no conteiner
        entry: make lint-front
        language: system
        pass_filenames: false
        stages: [pre-push]
